<!-- Partial for a single Todo/Note card -->
<div class="card border-0 shadow-sm mb-3 bg-white" style="border-radius: 12px; transition: transform 0.2s;">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <h6
                class="fw-bold mb-0 text-dark {% if note.status == 'Completed' %}text-decoration-line-through text-muted{% endif %}">
                {{ note.title }}
            </h6>
            <!-- Dropdown Menu -->
            <div class="dropdown">
                <button class="btn btn-sm btn-link text-muted p-0" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="bi bi-three-dots-vertical"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" style="border-radius: 10px;">
                    <li>
                        <button class="dropdown-item small" data-bs-toggle="modal"
                            data-bs-target="#editModal{{ note.id }}">
                            <i class="bi bi-pencil me-2 text-primary"></i> Edit
                        </button>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <form action="{{ url_for('nuha_todo.delete', note_id=note.id) }}" method="POST"
                            class="d-inline">
                            <button type="submit" class="dropdown-item small text-danger">
                                <i class="bi bi-trash me-2"></i> Delete
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>

        {% if note.description %}
        <p class="small text-muted mb-2" style="font-size: 0.8rem; line-height: 1.4;">
            {{ note.description | truncate(100) }}
        </p>
        {% endif %}

        <!-- Status Toggle -->
        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
            <span class="text-muted" style="font-size: 0.7rem;">
                {{ note.created_at.strftime('%b %d, %Y') }}
            </span>
            {% if note.type == 'Task' %}
            <form action="{{ url_for('nuha_todo.update', note_id=note.id) }}" method="POST">
                {% if note.status == 'Pending' %}
                <input type="hidden" name="status" value="Completed">
                <button type="submit" class="btn btn-sm btn-outline-success rounded-pill"
                    style="font-size: 0.7rem; padding: 2px 10px;">
                    Mark Done
                </button>
                {% else %}
                <input type="hidden" name="status" value="Pending">
                <button type="submit" class="btn btn-sm btn-light rounded-pill"
                    style="font-size: 0.7rem; padding: 2px 10px;">
                    Reopen
                </button>
                {% endif %}
            </form>
            {% else %}
            <span
                class="badge {% if note.type == 'Reminder' %}bg-warning text-dark{% else %}bg-success{% endif %} bg-opacity-10 rounded-pill px-2"
                style="font-size: 0.7rem;">
                {{ note.type }}
            </span>
            {% endif %}
        </div>
    </div>
</div>

<!-- Edit Modal for this specific note -->
<div class="modal fade" id="editModal{{ note.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 16px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Edit {{ note.type }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{{ url_for('nuha_todo.update', note_id=note.id) }}" method="POST">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Title</label>
                        <input type="text" name="title" class="form-control border-0 bg-light" value="{{ note.title }}"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Description</label>
                        <textarea name="description" class="form-control border-0 bg-light"
                            rows="3">{{ note.description }}</textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom rounded-pill px-4">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
